<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f2e9">
    <title>Endereço de entrega — Smash & Co.</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="announcement">Entrega padrão grátis em pedidos acima de US$ 35 · Peça direto e aproveite</div>
    <header class="site-header"><div class="header-inner">
        <a href="index.html" class="logo" aria-label="Página inicial da Smash & Co."><img src="images/logo-smash-co-burguer.png" alt="Smash & Co."></a>
        <a href="cart.html" class="header-cart">← Voltar à sacola</a>
    </div></header>
    <main class="container">
        <section class="page-title"><div class="eyebrow">Etapa 1 de 2 · Entrega</div><h1>ONDE VAMOS<br>ENTREGAR?</h1></section>
        <div class="checkout-layout">
            <form id="delivery-form">
                <section class="checkout-section">
                    <h2>Endereço de entrega</h2>
                    <div class="form-grid">
                        <div class="form-group full"><label for="address">Rua e número</label><input id="address" name="address" type="text" autocomplete="street-address" placeholder="123, Rua Principal" required></div>
                        <div class="form-group"><label for="unit">Apartamento, sala etc. <span>(opcional)</span></label><input id="unit" name="unit" type="text" autocomplete="address-line2" placeholder="Apto. 4B"></div>
                        <div class="form-group"><label for="city">Cidade</label><input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Sua cidade" required></div>
                        <div class="form-group"><label for="state">Estado</label><input id="state" name="state" type="text" autocomplete="address-level1" placeholder="CA" pattern="[A-Za-z]{2}" title="Informe a sigla de duas letras do estado" required></div>
                        <div class="form-group"><label for="zip">Código postal dos EUA (ZIP)</label><input id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="90210" pattern="[0-9]{5}(-[0-9]{4})?" title="Informe um código postal ZIP válido" required></div>
                    </div>
                </section>
                <section class="checkout-section">
                    <h2>Escolha o prazo de entrega</h2>
                    <div class="payment-options">
                        <label class="payment-option"><input type="radio" name="speed" value="standard" checked><span><strong>Entrega padrão</strong><small>30–45 min · US$ 3,99 <span class="free-delivery">grátis acima de US$ 35</span></small></span><b>🛵</b></label>
                        <label class="payment-option"><input type="radio" name="speed" value="priority"><span><strong>Entrega expressa</strong><small>15–25 min · US$ 5,99</small></span><b>⚡</b></label>
                    </div>
                </section>
                <button class="place-order" type="submit">Continuar para o pagamento <span>→</span></button>
            </form>
            <aside class="checkout-summary" id="delivery-summary"></aside>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-inner"><a href="index.html" class="logo" aria-label="Página inicial da Smash & Co."><img src="images/logo-smash-co-burguer.png" alt="Smash & Co."></a><p>Demonstração de portfólio — nenhuma cobrança real será feita.</p><div class="footer-links"><a href="menu.html">Cardápio</a></div></div></footer>
    <script src="catalog.js"></script>
    <script src="cart.js"></script>
    <script src="delivery.js"></script>
</body>
</html>
