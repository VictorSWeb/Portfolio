<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f2e9">
    <title>Delivery address — Smash & Co.</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="announcement">Free standard delivery on orders over $35 · Order direct, eat happy</div>
    <header class="site-header"><div class="header-inner">
        <a href="index.html" class="logo" aria-label="Smash & Co. home"><img src="images/logo-smash-co-burguer.png" alt="Smash & Co."></a>
        <a href="cart.html" class="header-cart">← Back to cart</a>
    </div></header>
    <main class="container">
        <section class="page-title"><div class="eyebrow">Step 1 of 2 · Delivery</div><h1>WHERE SHOULD<br>WE DROP IT?</h1></section>
        <div class="checkout-layout">
            <form id="delivery-form">
                <section class="checkout-section">
                    <h2>Delivery address</h2>
                    <div class="form-grid">
                        <div class="form-group full"><label for="address">Street address</label><input id="address" name="address" type="text" autocomplete="street-address" placeholder="123 Main Street" required></div>
                        <div class="form-group"><label for="unit">Apt, suite, etc. <span>(optional)</span></label><input id="unit" name="unit" type="text" autocomplete="address-line2" placeholder="Apt 4B"></div>
                        <div class="form-group"><label for="city">City</label><input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Your city" required></div>
                        <div class="form-group"><label for="state">State</label><input id="state" name="state" type="text" autocomplete="address-level1" placeholder="CA" pattern="[A-Za-z]{2}" title="Enter a two-letter state code" required></div>
                        <div class="form-group"><label for="zip">ZIP code</label><input id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="90210" pattern="[0-9]{5}(-[0-9]{4})?" title="Enter a valid ZIP code" required></div>
                    </div>
                </section>
                <section class="checkout-section">
                    <h2>Choose your delivery speed</h2>
                    <div class="payment-options">
                        <label class="payment-option"><input type="radio" name="speed" value="standard" checked><span><strong>Standard delivery</strong><small>30–45 min · $3.99 <span class="free-delivery">free over $35</span></small></span><b>🛵</b></label>
                        <label class="payment-option"><input type="radio" name="speed" value="priority"><span><strong>Express delivery</strong><small>15–25 min · $5.99</small></span><b>⚡</b></label>
                    </div>
                </section>
                <button class="place-order" type="submit">Continue to payment <span>→</span></button>
            </form>
            <aside class="checkout-summary" id="delivery-summary"></aside>
        </div>
    </main>
    <footer class="site-footer"><div class="container footer-inner"><a href="index.html" class="logo" aria-label="Smash & Co. home"><img src="images/logo-smash-co-burguer.png" alt="Smash & Co."></a><p>Portfolio demo — no real payment will be charged.</p><div class="footer-links"><a href="menu.html">Menu</a></div></div></footer>
    <script src="catalog.js"></script>
    <script src="cart.js"></script>
    <script src="delivery.js"></script>
</body>
</html>
