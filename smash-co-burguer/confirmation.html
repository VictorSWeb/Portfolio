<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f2e9">
    <title>Order confirmed — Smash & Co.</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="status.css">
</head>
<body>
    <div class="announcement">Your smash is in the works ✳</div>
    <header class="site-header"><div class="header-inner">
        <a href="index.html" class="logo" aria-label="Smash & Co. home"><img src="images/logo-smash-co-burguer.png" alt="Smash & Co."></a>
        <a href="index.html" class="header-cart">Back to home</a>
    </div></header>
    <main class="confirmation container">
        <div class="confirmation-box">
            <div class="check">✓</div>
            <div class="eyebrow">Your order is on the griddle</div>
            <h1 id="confirmation-title">ORDER<br>CONFIRMED!</h1>
            <p id="confirmation-copy">Get your appetite ready. We’ll take it from here.</p>
            <div class="order-number" id="order-number"></div>
            <div class="confirmation-actions">
                <a href="tracking.html" class="btn btn-primary" id="track-order">Track your order <span>→</span></a>
                <a href="menu.html" class="btn btn-secondary">Order something else</a>
            </div>
            <p class="demo-disclaimer">Portfolio demo — order placement and tracking are simulated. No real order or payment is processed.</p>
        </div>
    </main>
    <script src="confirmation.js"></script>
</body>
</html>
